<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purple Buttons</title>

    <!-- Bootstrap CDN Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* CSS Inline 3ashan mayshalsh mn 3andek ay moskela f el-path */
        .btn-purple-1 { background-color: #E9D5FF; color: #581C87; border: none; }
        .btn-purple-2 { background-color: #D8B4FE; color: #581C87; border: none; }
        .btn-purple-3 { background-color: #C084FC; color: #1E1B4B; border: none; }
        .btn-purple-4 { background-color: #A855F7; color: #FFFFFF; border: none; }
        .btn-purple-5 { background-color: #9333EA; color: #FFFFFF; border: none; }
        .btn-purple-6 { background-color: #7E22CE; color: #FFFFFF; border: none; }
        .btn-purple-7 { background-color: #6B21A8; color: #FFFFFF; border: none; }
        .btn-purple-8 { background-color: #3B0764; color: #FFFFFF; border: none; }

        .btn-purple-link { 
            background-color: transparent; 
            color: #7E22CE; 
            text-decoration: underline; 
            border: none;
        }

        .btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body class="p-4">

    <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-purple-1">Lavender</button>
        <button type="button" class="btn btn-purple-2">Lilac</button>
        <button type="button" class="btn btn-purple-3">Medium Purple</button>
        <button type="button" class="btn btn-purple-4">Purple</button>
        <button type="button" class="btn btn-purple-5">Dark Purple</button>
        <button type="button" class="btn btn-purple-6">Deep Violet</button>
        <button type="button" class="btn btn-purple-7">Plum</button>
        <button type="button" class="btn btn-purple-8">Night Violet</button>
        <button type="button" class="btn btn-purple-link">Purple Link</button>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
