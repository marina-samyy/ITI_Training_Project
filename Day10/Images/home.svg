<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="storyIllTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="storyIllTitle">Illustration of a home with children holding hands under a warm sky</title>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#2E1A47"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2359"/>
      <stop offset="100%" stop-color="#21132F"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8B84B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8B84B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky background -->
  <rect x="0" y="0" width="600" height="450" fill="url(#skyGrad)"/>

  <!-- Sun glow + sun -->
  <circle cx="470" cy="90" r="90" fill="url(#sunGlow)"/>
  <circle cx="470" cy="90" r="38" fill="#E8B84B"/>

  <!-- Soft hill / ground -->
  <path d="M0,340 C120,300 220,320 300,330 C400,342 500,310 600,330 L600,450 L0,450 Z" fill="#3a2359" opacity="0.6"/>
  <path d="M0,375 C140,350 260,370 360,368 C460,366 520,388 600,372 L600,450 L0,450 Z" fill="#21132F"/>

  <!-- Stars -->
  <circle cx="60" cy="60" r="2.5" fill="#F8F5FC" opacity="0.8"/>
  <circle cx="120" cy="110" r="1.8" fill="#F8F5FC" opacity="0.6"/>
  <circle cx="200" cy="50" r="2" fill="#F8F5FC" opacity="0.7"/>
  <circle cx="340" cy="40" r="1.6" fill="#F8F5FC" opacity="0.5"/>

  <!-- Little house -->
  <g transform="translate(90,215)">
    <rect x="0" y="55" width="150" height="100" rx="6" fill="url(#houseGrad)"/>
    <polygon points="-15,60 75,-5 165,60" fill="#9B59B6"/>
    <rect x="63" y="95" width="24" height="60" rx="3" fill="#E8B84B"/>
    <circle cx="80" cy="125" r="2.2" fill="#2E1A47"/>
    <rect x="18" y="80" width="30" height="28" rx="4" fill="#F8F5FC" opacity="0.9"/>
    <rect x="102" y="80" width="30" height="28" rx="4" fill="#F8F5FC" opacity="0.9"/>
    <path d="M18,94 H48 M33,80 V108" stroke="#9B59B6" stroke-width="2"/>
    <path d="M102,94 H132 M117,80 V108" stroke="#9B59B6" stroke-width="2"/>
    <rect x="-4" y="50" width="158" height="8" rx="4" fill="#E8B84B"/>
  </g>

  <!-- Heart above the house -->
  <path d="M300,150 c-10,-14 -34,-14 -34,6 c0,16 34,34 34,34 c0,0 34,-18 34,-34 c0,-20 -24,-20 -34,-6 z"
        fill="#E8B84B" opacity="0.95"/>

  <!-- Three children silhouettes holding hands -->
  <g fill="#F8F5FC">
    <!-- child left -->
    <circle cx="190" cy="365" r="16"/>
    <path d="M190,381 c-20,0 -30,16 -30,34 h60 c0,-18 -10,-34 -30,-34 z"/>
    <!-- child middle (taller) -->
    <circle cx="255" cy="352" r="18"/>
    <path d="M255,370 c-22,0 -33,18 -33,38 h66 c0,-20 -11,-38 -33,-38 z"/>
    <!-- child right -->
    <circle cx="320" cy="365" r="16"/>
    <path d="M320,381 c-20,0 -30,16 -30,34 h60 c0,-18 -10,-34 -30,-34 z"/>
  </g>
  <!-- joined hands accent -->
  <rect x="207" y="398" width="20" height="7" rx="3.5" fill="#F8F5FC"/>
  <rect x="288" y="398" width="20" height="7" rx="3.5" fill="#F8F5FC"/>

  <!-- birds -->
  <path d="M420,150 q8,-10 16,0 q8,-10 16,0" stroke="#F8F5FC" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M380,180 q6,-8 12,0 q6,-8 12,0" stroke="#F8F5FC" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85"/>
</svg>
